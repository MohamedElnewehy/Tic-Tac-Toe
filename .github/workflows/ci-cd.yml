name: TicTacToe CI/CD Pipeline

on: [push, pull_request, workflow_dispatch]

env:
  QT_VERSION: 6.5.0

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build-type: [Release, Debug]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'mac' }}
          target: desktop
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2019_64' || runner.os == 'Linux' && 'gcc_64' || 'clang_64' }}
          install-deps: true
          cache: true

      - name: Expose Qt6 CMake Path
        run: echo "Qt6_DIR=${{ env.QT_INSTALL_DIR }}/lib/cmake/Qt6" >> $GITHUB_ENV

      - name: Install MSVC Dev Cmd (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libgl1-mesa-dev

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Configure CMake
        run: cmake -B build -G Ninja \
               -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
               -DQt6_DIR=${{ env.Qt6_DIR }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build-type }} --parallel

      - name: Run Tests
        run: |
          cd build
          ctest -C ${{ matrix.build-type }} --output-on-failure --verbose --parallel --timeout 300

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.build-type }}
          path: build/Testing/

      - name: Upload Build Artifacts
        if: matrix.build-type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-${{ matrix.os }}-Release
          path: build/TicTacToe_V2*
