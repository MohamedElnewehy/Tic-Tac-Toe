name: Qt CI/CD Pipeline

on:
  push:
    branches: [TicTacToe_V2]
  pull_request:
    branches: [TicTacToe_V2]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 🧾 Checkout repository
      uses: actions/checkout@v3

    - name: 🧰 Install Qt 6.9.0
      uses: jurplel/install-qt-action@v3
      with:
        version: 6.9.0
        host: linux
        target: desktop
        arch: gcc_64

    - name: 🛠️ Build project using qmake
      run: |
        qmake Advanced_TicTacToe.pro CONFIG+=release
        make

    - name: 📦 Archive build output
      run: |
        mkdir -p dist
        cp -r *.pro dist/
        cp -r *.cpp dist/
        cp -r *.h dist/
        cp -r *.ui dist/
        cp -r *.o dist/ || true
        cp -r Advanced_TicTacToe dist/ || true

    - name: 📤 Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: built-qt-app
        path: dist
