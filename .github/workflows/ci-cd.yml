name: Build Only

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 [1]

      - name: Install Qt & QMake
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-qmake build-essential [2]

      - name: Configure with QMake
        run: |
          qmake TicTacToe_V2.pro CONFIG+=release

      - name: Build Project
        run: |
          make -j$(nproc)

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Build
          path: ./TicTacToe_V2  # Adjust path if your binary name differs [3]
