name: Console Tic Tac Toe CI/CD (No Testing)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [published]

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create build directory
      run: mkdir -p release
      shell: bash

    - name: Download picosha2.h
      run: curl -L -o picosha2.h https://raw.githubusercontent.com/okdshin/PicoSHA2/master/picosha2.h
      shell: bash

    - name: Compile Main Application (Release)
      run: |
        g++ main.cpp menu.cpp classic_game.cpp overwrite_game.cpp ai_engine.cpp game_core.cpp TicTacToeDB.cpp sqlite3.c -o release/TicTacToe.exe -O2 -I. -std=c++17 -pthread
      shell: bash

    - name: Package application
      run: |
        Compress-Archive -Path release\* -DestinationPath TicTacToe-Windows-Release.zip
      shell: powershell

    - name: Upload release asset
      uses: actions/upload-release-asset@v1
      if: github.event_name == 'release' && github.event.action == 'published'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: TicTacToe-Windows-Release.zip
        asset_name: TicTacToe-Windows-Release.zip
        asset_content_type: application/zip
