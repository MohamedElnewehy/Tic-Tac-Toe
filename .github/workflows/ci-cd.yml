name: Advanced Tic Tac Toe CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  QT_VERSION: 6.5.0

jobs:
  # Static Code Analysis
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install cppcheck
      run: sudo apt-get update && sudo apt-get install -y cppcheck
    
    - name: Run cppcheck
      run: |
        cppcheck --enable=all --inconclusive --xml --xml-version=2 \
          --suppress=missingInclude --suppress=unusedFunction \
          src/ 2> cppcheck-report.xml || true
    
    - name: Upload cppcheck results
      uses: actions/upload-artifact@v4
      with:
        name: cppcheck-report
        path: cppcheck-report.xml

  # Build and Test on Linux
  build-linux:
    name: Build and Test (Linux)
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        modules: 'qtbase qttools'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          libsqlite3-dev \
          libgtest-dev \
          lcov \
          valgrind
    
    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_PREFIX_PATH=${{ env.Qt6_DIR }} \
          -DENABLE_TESTING=ON \
          -DENABLE_COVERAGE=ON \
          -G Ninja
    
    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }}
    
    - name: Run Unit Tests
      run: |
        cd build
        ctest --output-on-failure --verbose
    
    - name: Generate Coverage Report
      run: |
        cd build
        lcov --capture --directory . --output-file coverage.info
        lcov --remove coverage.info '/usr/*' --output-file coverage.info
        lcov --list coverage.info
    
    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: build/coverage.info
        flags: unittests
        name: codecov-umbrella
    
    - name: Memory Leak Check
      run: |
        cd build
        valgrind --tool=memcheck --leak-check=full --show-leak-kinds=all \
          --track-origins=yes --verbose --log-file=valgrind-out.txt \
          ./tests/TicTacToeTests || true
    
    - name: Upload test artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-test-results
        path: |
          build/coverage.info
          build/valgrind-out.txt

  # Build and Test on Windows
  build-windows:
    name: Build and Test (Windows)
    runs-on: windows-latest
    needs: code-quality
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        arch: win64_msvc2019_64
        modules: 'qtbase qttools'
    
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v1.1
    
    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DENABLE_TESTING=ON
    
    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }}
    
    - name: Run Tests
      run: |
        cd build
        ctest -C ${{ env.BUILD_TYPE }} --output-on-failure

  # Build and Test on macOS
  build-macos:
    name: Build and Test (macOS)
    runs-on: macos-latest
    needs: code-quality
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        modules: 'qtbase qttools'
    
    - name: Install dependencies
      run: |
        brew install cmake ninja sqlite googletest
    
    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DENABLE_TESTING=ON \
          -G Ninja
    
    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }}
    
    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure

  # Performance Testing
  performance-test:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: [build-linux]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Qt and dependencies
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        modules: 'qtbase qttools'
    
    - name: Install benchmark tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build libsqlite3-dev time
    
    - name: Configure CMake with benchmarks
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DENABLE_BENCHMARKS=ON \
          -G Ninja
    
    - name: Build benchmarks
      run: cmake --build build --config Release
    
    - name: Run performance tests
      run: |
        cd build
        ./benchmarks/TicTacToeBenchmarks --benchmark_format=json > benchmark-results.json || true
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: build/benchmark-results.json

  # Security Scanning
  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run CodeQL Analysis
      uses: github/codeql-action/init@v2
      with:
        languages: cpp
    
    - name: Install Qt and build
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        modules: 'qtbase qttools'
    
    - name: Configure and build for security scan
      run: |
        sudo apt-get update && sudo apt-get install -y cmake ninja-build libsqlite3-dev
        cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja
        cmake --build build --config Release
    
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2

  # Documentation Generation
  documentation:
    name: Generate Documentation
    runs-on: ubuntu-latest
    needs: [build-linux]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Doxygen
      run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
    
    - name: Generate documentation
      run: |
        doxygen Doxyfile || echo "Doxygen config not found, creating basic docs"
        mkdir -p docs/html
        echo "<h1>Advanced Tic Tac Toe Documentation</h1>" > docs/html/index.html
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs/html

  # Release Creation
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos, performance-test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Generate version number
      id: version
      run: |
        VERSION=$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Generated version: $VERSION"
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
    
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.version.outputs.version }}
        release_name: Advanced Tic Tac Toe v${{ steps.version.outputs.version }}
        body: |
          ## Advanced Tic Tac Toe Release v${{ steps.version.outputs.version }}
          
          ### Features
          - Complete Qt-based GUI implementation
          - AI opponents with multiple difficulty levels
          - User authentication and session management
          - Game history and replay functionality
          - SQLite database integration
          
          ### Testing
          - All unit tests passed
          - Cross-platform compatibility verified
          - Memory leak detection completed
          - Performance benchmarks included
          
          ### Downloads
          - Source code available below
          - Documentation: [GitHub Pages](https://yourusername.github.io/advanced-tictactoe-cpp/)
        draft: false
        prerelease: false

  # Deployment to staging (optional)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [create-release]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup staging environment
      run: |
        echo "Setting up staging environment..."
        echo "This could deploy to a cloud service or container registry"
        echo "For demonstration purposes, we'll just create deployment artifacts"
    
    - name: Create deployment package
      run: |
        mkdir -p deployment
        tar -czf deployment/tictactoe-staging.tar.gz src/ CMakeLists.txt README.md
    
    - name: Upload deployment artifact
      uses: actions/upload-artifact@v4
      with:
        name: staging-deployment
        path: deployment/
