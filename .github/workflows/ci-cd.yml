name: TicTacToe_V2 CI/CD Pipeline

on:
  push:
    branches: [ TicTacToe_V2 ]    # Only run on TicTacToe_V2 branch [1]
  pull_request:
    branches: [ TicTacToe_V2 ]    # Tests PRs targeting TicTacToe_V2 [1]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-qmake build-essential cmake ninja-build libgl1-mesa-dev [2]

      - name: Build with qmake
        run: |
          qmake Advanced_TicTacToe.pro CONFIG+=release
          make -j$(nproc) [2]

      - name: Package Artifacts
        run: |
          mkdir -p artifact
          cp TicTacToe_V2 artifact/
          tar -czf TicTacToe_V2_${{ github.sha }}.tar.gz -C artifact . [3]

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe_V2-release
          path: TicTacToe_V2_${{ github.sha }}.tar.gz [3]
