name: TicTacToe CI/CD Pipeline

on:
  push:
    branches: [ main, develop, TicTacToe_V2 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build-type: [Release, Debug]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.0'
          host: ${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'mac' }}
          target: 'desktop'
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2019_64' || runner.os == 'Linux' && 'gcc_64' || 'clang_64' }}
          install-deps: 'true'

      - name: Install MSVC Dev Command (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libgl1-mesa-dev

      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja

      - name: Configure with CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DCMAKE_PREFIX_PATH=${{ env.Qt6_DIR }}

      - name: Build Project
        run: cmake --build build --config ${{ matrix.build-type }} --parallel

      - name: Run Tests
        run: |
          cd build
          ctest -C ${{ matrix.build-type }} --output-on-failure --verbose --parallel --timeout 300

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.build-type }}
          path: |
            build/Testing/
            build/test_detail.xml

      - name: Upload Build Artifacts (Release only)
        if: matrix.build-type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: tictactoe-${{ runner.os }}-${{ matrix.build-type }}
          path: build/TicTacToe_V2*
