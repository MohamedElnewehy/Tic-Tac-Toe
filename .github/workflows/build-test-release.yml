name: Console Tic Tac Toe CI/CD (No Qt)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [published]

jobs:
  build-test-release:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create build directories
      run: |
        mkdir -p debug
        mkdir -p release
      shell: bash

    - name: Clone Google Test
      run: |
        git clone https://github.com/google/googletest.git
      shell: bash

    - name: Compile and Build Debug Test Executables
      run: |
        g++ testing_logic.cpp googletest/googletest/src/gtest-all.cc -o debug/testing_logic.exe -Igoogletest/googletest/include -Igoogletest/googletest -pthread -std=c++17
        g++ testing_database.cpp googletest/googletest/src/gtest-all.cc -o debug/testing_database.exe -Igoogletest/googletest/include -Igoogletest/googletest -lsqlite3 -lpicosha2 -pthread -std=c++17
        g++ testingAI.cpp googletest/googletest/src/gtest-all.cc -o debug/testingAI.exe -Igoogletest/googletest/include -Igoogletest/googletest -pthread -std=c++17
        g++ testingOverwrite.cpp googletest/googletest/src/gtest-all.cc -o debug/testingOverwrite.exe -Igoogletest/googletest/include -Igoogletest/googletest -pthread -std=c++17
      shell: bash

    - name: Run Tests (Google Test)
      run: |
        echo "Listing contents of debug build directory:"
        ls -F debug/
        echo "Running tests..."
        ./debug/testing_logic.exe --gtest_output="xml:test_results_logic.xml"
        ./debug/testing_database.exe --gtest_output="xml:test_results_database.xml"
        ./debug/testingAI.exe --gtest_output="xml:test_results_AI.xml"
        ./debug/testingOverwrite.exe --gtest_output="xml:test_results_overwrite.xml"
      shell: bash

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: google-test-results
        path: "*.xml"

    - name: Compile and Build Main Application (Release)
      run: |
        g++ main.cpp menu.cpp classic_game.cpp overwrite_game.cpp ai_engine.cpp game_core.cpp TicTacToeDB.cpp sqlite3.c -o release/TicTacToe.exe -O2 -I. -L. -lsqlite3 -lpicosha2 -pthread -std=c++17
      shell: bash

    - name: Package application for release
      run: |
        Compress-Archive -Path release\* -DestinationPath TicTacToe-Windows-Release.zip
      shell: powershell

    - name: Upload release asset
      uses: actions/upload-release-asset@v1
      if: github.event_name == 'release' && github.event.action == 'published'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: TicTacToe-Windows-Release.zip
        asset_name: TicTacToe-Windows-Release.zip
        asset_content_type: application/zip
