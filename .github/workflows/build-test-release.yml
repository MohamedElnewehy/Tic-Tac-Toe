name: Console Tic Tac Toe CI/CD

on:
  push:
    branches:
      - main # Trigger on pushes to the main branch
  pull_request:
    branches:
      - main # Trigger on pull requests targeting the main branch
  release:
    types: [published] # Trigger the CD part when a new release is published

jobs:
  build-test-release:
    runs-on: windows-latest # Use the latest Windows environment for MSVC compatibility

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Action to fetch your repository's code

    - name: Setup MSVC Compiler Environment
      # This action is specifically designed to correctly set up the Visual Studio
      # development command prompt environment, making 'cl.exe' and 'nmake' available.
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Qt 6.8.3 (MSVC 2022 64-bit)
      # Installs the specific Qt version and architecture you're using.
      # This is based on your `qtdiag` output.
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.3'
        target: desktop
        arch: 'win64_msvc2022_64'

    # --- CI Part: Build Debug for Tests and Run Tests ---

    - name: Configure project (Debug build for tests)
      # Uses 'TicTest.pro' as confirmed. 'CONFIG+=debug' for a debug build.
      # '-spec win32-msvc' is explicitly included as it worked previously with ilammy action.
      run: qmake TicTest.pro -spec win32-msvc "CONFIG+=debug"
      shell: cmd # Ensure this command runs in a cmd shell for proper environment

    - name: Build project (Debug build for tests)
      # 'nmake' is the build tool for MSVC.
      run: nmake debug
      shell: cmd # Ensure this command runs in a cmd shell

    - name: Run Tests (Google Test)
      # Executes each of your Google Test executables.
      # Assumes they are built into the 'debug\' subdirectory of your project root.
      # Ensure these names EXACTLY match what your local build produces.
      run: |
        echo "Listing contents of debug build directory:"
        ls -F debug/ # Use 'ls -F .' if executables are directly in build root
        echo "Attempting to run Google Tests..."
        .\debug\testing_logic.exe --gtest_output="xml:test_results_logic.xml"
        .\debug\testing_database.exe --gtest_output="xml:test_results_database.xml"
        .\debug\testingAI.exe --gtest_output="xml:test_results_AI.xml"
        .\debug\testingOverwrite.exe --gtest_output="xml:test_results_overwrite.xml"
      shell: bash # Bash is suitable for 'ls' and managing multiple commands.
      working-directory: ${{ github.workspace }} # Commands run from the repository root

    - name: Upload Test Results
      uses: actions/upload-artifact@v4 # Uploads the generated XML test reports
      if: always() # Uploads even if tests fail, so you can inspect failures
      with:
        name: google-test-results
        path: "*.xml" # Path to your Google Test XML output files

    # --- CD Part: Clean, Build Release, Deploy, Package, Upload ---

    - name: Clean previous build artifacts
      # Cleans the debug build output before starting the release build.
      run: nmake clean
      shell: cmd

    - name: Configure project (Release build for deployment)
      # Configures for a release build.
      run: qmake TicTest.pro -spec win32-msvc "CONFIG+=release"
      shell: cmd

    - name: Build project (Release build for deployment)
      run: nmake release
      shell: cmd

    - name: Deploy Qt dependencies (windeployqt)
      # Gathers necessary Qt runtime DLLs and plugins for your application.
      # Even for console apps, if they link Qt Core/Network/etc., this is important.
      # 'TicTest.exe' is assumed to be your main application's executable name.
      run: |
        "C:\Qt\6.8.3\msvc2022_64\bin\windeployqt.exe" TicTest.exe
      working-directory: ${{ github.workspace }}\release # Execute from the release build directory
      shell: cmd

    - name: Package application for release
      # Creates a zip archive of the release build, including deployed Qt dependencies.
      run: |
        Compress-Archive -Path release\* -DestinationPath TicTacToe-Windows-Release.zip
      shell: powershell # PowerShell's Compress-Archive is used here

    - name: Upload release asset
      # This step only runs when a GitHub Release is published, uploading the zip.
      uses: actions/upload-release-asset@v1
      if: github.event_name == 'release' && github.event.action == 'published'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Built-in token for GitHub API access
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: TicTacToe-Windows-Release.zip
        asset_name: TicTacToe-Windows-Release.zip
        asset_content_type: application/zip
