name: GoogleTest CI for Qt Tic Tac Toe

on:
  push:
    branches: [TicTacToe_V2]
  pull_request:
    branches: [TicTacToe_V2]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
    - name: 📦 Checkout source
      uses: actions/checkout@v4

    - name: 🛠️ Set up MSVC environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: 🧰 Install Qt 6.8.3 (MSVC 2022 64-bit)
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.3'
        target: desktop
        arch: win64_msvc2022_64

    - name: 🔧 Configure tests with CMake
      run: cmake -S tests -B build-tests -DCMAKE_PREFIX_PATH="%Qt6_DIR%" -DCMAKE_BUILD_TYPE=Release

    - name: 🧪 Build tests
      run: cmake --build build-tests --config Release

    - name: ▶️ Run tests
      run: ctest --test-dir build-tests --output-on-failure
