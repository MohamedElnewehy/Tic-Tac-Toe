name: TicTacToe CI/CD Pipeline

on:
  push:
    branches: [ main, develop, TicTacToe_V2 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  QT_VERSION: 6.5.0
  CMAKE_VERSION: 3.16

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build-type: [Release, Debug]
        
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Cache Qt
      id: cache-qt
      uses: actions/cache@v3
      with:
        path: |
          ${{ runner.workspace }}/Qt
        key: ${{ runner.os }}-QtCache-${{ env.QT_VERSION }}

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: ${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'mac' }}
        target: 'desktop'
        arch: ${{ runner.os == 'Windows' && 'win64_msvc2019_64' || runner.os == 'Linux' && 'gcc_64' || 'clang_64' }}
        install-deps: 'true'
        cache: 'true'
        cached: ${{ steps.cache-qt.outputs.cache-hit }}

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          libgl1-mesa-dev \
          libxkbcommon-x11-0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-xinerama0 \
          libxcb-xfixes0

    - name: Install System Dependencies (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install System Dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install cmake ninja

    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
          -DCMAKE_PREFIX_PATH=${{ env.Qt6_DIR }}

    - name: Build Project
      run: |
        cmake --build build --config ${{ matrix.build-type }} --parallel

    - name: Run Tests
      run: |
        cd build
        ctest -C ${{ matrix.build-type }} \
          --output-on-failure \
          --verbose \
          --parallel \
          --timeout 300

    - name: Upload Test Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.build-type }}
        path: |
          build/Testing/
          build/test_detail.xml
        retention-days: 7

    - name: Upload Build Artifacts (Release only)
      if: matrix.build-type == 'Release'
      uses: actions/upload-artifact@v3
      with:
        name: tictactoe-${{ runner.os }}-${{ matrix.build-type }}
        path: |
          build/TicTacToe_V2*
          !build/**/*.obj
          !build/**/*.o
        retention-days: 30

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'gcc_64'
        install-deps: 'true'

    - name: Install Analysis Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          gcov \
          lcov \
          cppcheck \
          clang-tidy \
          libgl1-mesa-dev

    - name: Configure with Coverage
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage" \
          -DCMAKE_PREFIX_PATH=${{ env.Qt6_DIR }}

    - name: Build with Coverage
      run: |
        cmake --build build --parallel

    - name: Run Tests with Coverage
      run: |
        cd build
        ctest --output-on-failure --verbose

    - name: Generate Coverage Report
      run: |
        cd build
        lcov --capture --directory . --output-file coverage.info
        lcov --remove coverage.info \
          '/usr/*' \
          '*/Qt6/*' \
          '*/googletest/*' \
          '*/sqlite3.*' \
          '*/build/*' \
          --output-file coverage_filtered.info
        lcov --list coverage_filtered.info

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: build/coverage_filtered.info
        flags: unittests
        name: codecov-umbrella

    - name: Run Static Analysis
      run: |
        cppcheck \
          --enable=all \
          --inconclusive \
          --xml \
          --xml-version=2 \
          --suppress=missingIncludeSystem \
          --suppress=unusedFunction \
          --suppress=unmatchedSuppression \
          --project=build/compile_commands.json \
          2> cppcheck-results.xml || true

    - name: Upload Static Analysis Results
      uses: actions/upload-artifact@v3
      with:
        name: static-analysis-results
        path: cppcheck-results.xml

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build-and-test, code-quality]
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download All Artifacts
      uses: actions/download-artifact@v3

    - name: Create Release Package
      run: |
        mkdir -p release
        find . -name "tictactoe-*" -type d | while read dir; do
          if [ -d "$dir" ]; then
            os_name=$(echo "$dir" | cut -d'-' -f2)
            cd "$dir"
            zip -r "../release/TicTacToe-${os_name}.zip" .
            cd - > /dev/null
          fi
        done

    - name: Generate Release Notes
      run: |
        echo "# TicTacToe Release $(date +'%Y-%m-%d')" > release_notes.md
        echo "" >> release_notes.md
        echo "## Changes in this release:" >> release_notes.md
        git log --oneline --since="1 week ago" >> release_notes.md || echo "- Initial release" >> release_notes.md

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: release/*.zip
        body_path: release_notes.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    if: always()
    needs: [build-and-test, code-quality]
    runs-on: ubuntu-latest
    
    steps:
    - name: Notify Success
      if: needs.build-and-test.result == 'success' && needs.code-quality.result == 'success'
      run: |
        echo "✅ All tests passed successfully!"
        echo "Build Status: ${{ needs.build-and-test.result }}"
        echo "Code Quality: ${{ needs.code-quality.result }}"

    - name: Notify Failure
      if: needs.build-and-test.result == 'failure' || needs.code-quality.result == 'failure'
      run: |
        echo "❌ Build or tests failed!"
        echo "Build Status: ${{ needs.build-and-test.result }}"
        echo "Code Quality: ${{ needs.code-quality.result }}"
        exit 1
